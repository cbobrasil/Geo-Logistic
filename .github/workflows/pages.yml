name: build-and-deploy-site

on:
  workflow_dispatch:
  schedule:
    - cron: "15 00 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: generate today
        run: python src/create_orders_today.py

      - name: consolidate
        run: python src/consolidate_duckdb.py

      - name: build routes report
        run: |
          python src/build_routes_report.py \
            --orders-path data/silver/orders_all.csv \
            --warehouse-csv data/warehouse.csv \
            --out-html output/index.html

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
